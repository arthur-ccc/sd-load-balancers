global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend web_backends

backend web_backends
    balance roundrobin
    # Health check ativo: verifica /health a cada 2s,
    # marca DOWN após 3 falhas seguidas, UP após 2 sucessos
    option httpchk GET /health
    default-server inter 2s fall 3 rise 2

    server backend01 backend01:8000 check
    server backend02 backend02:8000 check
    server backend03 backend03:8000 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
