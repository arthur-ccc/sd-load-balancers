events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream web_backends {
        # balanceamento round robin (padrão)
        # health check passivo: marca DOWN após 3 falhas em 2s,
        # volta a tentar após fail_timeout
        server backend01:8000 max_fails=3 fail_timeout=2s;
        server backend02:8000 max_fails=3 fail_timeout=2s;
        server backend03:8000 max_fails=3 fail_timeout=2s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://web_backends;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        location /health {
            return 200 'ok';
        }
    }
}
